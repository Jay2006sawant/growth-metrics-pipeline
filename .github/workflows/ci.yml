name: pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r python/requirements.txt
      - run: python python/validate_raw.py
      - run: python python/etl_load.py
      - run: python python/run_quality_checks.py
      - run: python python/export_dashboard.py
      - run: pytest tests/ -q
